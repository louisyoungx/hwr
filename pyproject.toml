[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwr-platform"
version = "0.1.0"
description = "Vendor-neutral household embodied intelligence training platform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pyarrow>=20.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=11.0"]
assets3d = ["certifi>=2025.0", "trimesh==4.12.2"]
sim3d = ["mujoco==3.10.0"]
video = ["Pillow>=11.0"]
foundation = [
  "huggingface-hub>=0.34,<1.0",
  "safetensors>=0.4,<1.0",
  "sentencepiece>=0.2,<1.0",
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  "transformers>=4.57,<4.58",
]

[project.scripts]
hwr-train-scenario = "hwr.apps.train_scenario:main"
hwr-render-benchmarks = "hwr.apps.render_benchmarks:main"
hwr-render-3d-smoke = "hwr.apps.render_3d_smoke:main"
hwr-render-formal-scenes = "hwr.apps.render_formal_scenes:main"
hwr-verify-contact-grasp = "hwr.apps.verify_contact_grasp:main"
hwr-collect-formal-demos = "hwr.apps.collect_formal_demos:main"
hwr-train-formal-visual = "hwr.apps.train_formal_visual:main"
hwr-evaluate-formal-visual = "hwr.apps.evaluate_formal_visual:main"
hwr-train-formal-visual-knn = "hwr.apps.train_formal_visual_knn:main"
hwr-train-bimanual-rl = "hwr.apps.train_bimanual_rl:main"
hwr-evaluate-bimanual-rl = "hwr.apps.evaluate_bimanual_rl:main"
hwr-train-foundation-world-model = "hwr.apps.train_foundation_world_model:main"
hwr-evaluate-foundation-world-model = "hwr.apps.evaluate_foundation_world_model:main"
hwr-evaluate-observation-action-alignment = "hwr.apps.evaluate_observation_action_alignment:main"
hwr-evaluate-action-probe-power = "hwr.apps.evaluate_action_probe_power:main"
hwr-evaluate-paired-action-intervention = "hwr.apps.evaluate_paired_action_intervention:main"
hwr-evaluate-causal-plant-estimator = "hwr.apps.evaluate_causal_plant_estimator:main"
hwr-serve-foundation-dashboard = "hwr.apps.serve_foundation_dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
